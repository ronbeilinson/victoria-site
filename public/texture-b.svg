<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <!-- B: Natural Linen — medium weave, more visible thread structure, warm and organic -->
  <filter id="t" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.48 0.58" numOctaves="5" seed="7" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
    <feComponentTransfer in="grey">
      <feFuncR type="linear" slope="0.88" intercept="0.04"/>
      <feFuncG type="linear" slope="0.85" intercept="0.04"/>
      <feFuncB type="linear" slope="0.82" intercept="0.04"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#t)" opacity="0.65"/>
</svg>
