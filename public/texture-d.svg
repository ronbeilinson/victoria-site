<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <!-- D: Delicate Fabric — very fine high-octave noise, almost silky, barely perceptible -->
  <filter id="t" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.88 0.92" numOctaves="6" seed="4" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
    <feComponentTransfer in="grey">
      <feFuncR type="linear" slope="0.92" intercept="0.04"/>
      <feFuncG type="linear" slope="0.92" intercept="0.04"/>
      <feFuncB type="linear" slope="0.90" intercept="0.04"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#t)" opacity="0.5"/>
</svg>
