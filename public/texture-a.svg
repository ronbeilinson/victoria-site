<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <!-- A: Fine Linen — tight woven grain with horizontal thread bias, closest to SJ Bruce -->
  <filter id="t" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.68 0.82" numOctaves="4" seed="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
    <feComponentTransfer in="grey">
      <feFuncR type="linear" slope="0.9" intercept="0.05"/>
      <feFuncG type="linear" slope="0.9" intercept="0.05"/>
      <feFuncB type="linear" slope="0.9" intercept="0.05"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#t)" opacity="0.55"/>
</svg>
