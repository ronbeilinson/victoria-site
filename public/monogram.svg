<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="VT monogram">
  <!-- Outer hand-drawn oval seal -->
  <ellipse cx="50" cy="50" rx="46" ry="40" stroke="#211E18" stroke-width="1.1" opacity="0.85"/>
  <!-- Inner keyline -->
  <ellipse cx="50" cy="50" rx="41" ry="35" stroke="#211E18" stroke-width="0.6" opacity="0.5"/>
  <!-- Top and bottom flourish dots -->
  <circle cx="50" cy="11" r="1.1" fill="#211E18" opacity="0.7"/>
  <circle cx="50" cy="89" r="1.1" fill="#211E18" opacity="0.7"/>
  <!-- VT serif initials -->
  <text x="50" y="63"
        text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="42"
        font-style="italic"
        font-weight="400"
        letter-spacing="1"
        fill="#211E18">VT</text>
</svg>
